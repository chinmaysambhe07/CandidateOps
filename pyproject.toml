[build-system]
requires = ["setuptools>=68.0", "wheel"]
setuptools.apply()

[project]
name = "CandidateOps"
description = "Automated candidate tracking system for SAP Career portal"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "CandidateOps Developer", email = "dev@candidateops.example"}
]
keywords = ["sap", "recruitment", "automation", "web-scraping", "hr", "candidate-tracking"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Human Resources",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/CandidateOps"
Documentation = "https://github.com/yourusername/CandidateOps#readme"
Repository = "https://github.com/yourusername/CandidateOps"
Issues = "https://github.com/yourusername/CandidateOps/issues"

[project.scripts]
candidateops = "app.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.8.0",
    "black>=24.3.0",
    "flake8>=7.0.0",
    "isort>=5.13.2",
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.py$'
extend-exclude = '''
/(
  \.git
  | \.hg
  | \.mox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = 3.12
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"